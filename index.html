<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="WEBL Lochside – The Scottish Gym. Verified all-time bare knuckle rankings, top fighters, gym rankings and history.">
<meta name="keywords" content="WEBL, Lochside, Bare Knuckle, Scotland, Rankings, History">
<meta name="author" content="Lochside History Team">

<title>WEBL Lochside | The Scottish Gym</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
overflow-x:hidden;
font-family:Segoe UI,Arial,sans-serif;
background:#081020;
color:#e6e6e6;
}

body{
background:
linear-gradient(rgba(8,16,32,.92),rgba(8,16,32,.96)),
radial-gradient(circle at top right,rgba(212,175,55,.08),transparent 60%);
padding:12px;
min-height:100vh;
}

.container{
width:100%;
max-width:1400px;
margin:auto;
}

.page-header{
text-align:center;
padding:20px 10px;
border-bottom:1px solid rgba(212,175,55,.25);
margin-bottom:15px;
}

.brand h1{
font-size:2rem;
color:#d4af37;
margin-bottom:6px;
}

.brand h2{
font-size:1.2rem;
margin-bottom:8px;
color:#fff;
}

.brand p{
font-size:.9rem;
color:#cdb56b;
line-height:1.5;
}

.quick-links{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin:20px 0;
}

.quick-links a{
display:inline-block;
padding:10px 16px;
background:#132443;
border:1px solid #d4af37;
border-radius:6px;
color:#d4af37;
text-decoration:none;
font-weight:bold;
transition:.25s;
}

.quick-links a:hover{
background:#d4af37;
color:#081020;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:12px;
margin:20px 0;
}

.stat-card{
background:#10203d;
border:1px solid rgba(212,175,55,.3);
border-radius:8px;
padding:15px;
text-align:center;
}

.label{
font-size:.8rem;
color:#aaa;
margin-bottom:5px;
}

.value{
font-size:1.4rem;
font-weight:bold;
color:#d4af37;
}

.regions-section{
background:#10203d;
border:1px solid rgba(212,175,55,.3);
border-radius:8px;
padding:20px;
margin-top:20px;
}

.section-header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

.section-header h3{
color:#d4af37;
}

.search-box{
padding:10px;
border-radius:6px;
border:none;
width:250px;
max-width:100%;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#d4af37;
color:#081020;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid rgba(255,255,255,.08);
}

.rank-num{
color:#ffd700;
font-weight:bold;
}

.win-rate{
color:#3ddc84;
font-weight:bold;
}

.flag{
font-size:18px;
}

.btn{
display:inline-block;
margin:20px 10px 0 0;
padding:12px 20px;
background:#1d4ed8;
color:#fff;
text-decoration:none;
border-radius:6px;
font-weight:bold;
}

.page-footer{
text-align:center;
padding:25px 10px;
margin-top:30px;
border-top:1px solid rgba(212,175,55,.25);
font-size:.9rem;
color:#999;
}

@media(max-width:768px){

table,thead,tbody,tr,td{
display:block;
width:100%;
}

thead{
display:none;
}

tr{
margin-bottom:15px;
padding:10px;
border:1px solid rgba(255,255,255,.08);
border-radius:6px;
}

td{
display:flex;
justify-content:space-between;
}

td::before{
content:attr(data-label);
font-weight:bold;
color:#aaa;
}

.search-box{
width:100%;
}

}

</style>

</head>

<body>

<div class="container">
