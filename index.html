
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>WEBL Bare Knuckle Rankings</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#061327;
font-family:Arial,Helvetica,sans-serif;
color:#fff;
padding:20px;
}

.board{
width:100%;
max-width:1280px;
margin:auto;
background:linear-gradient(180deg,#0d203f 0%,#081426 100%);
border:4px solid #d4af37;
border-radius:18px;
box-shadow:0 0 35px rgba(0,0,0,.7);
overflow:hidden;
}

.header{
padding:30px 20px 22px;
text-align:center;
}

.header h1{
font-family:Georgia,serif;
font-size:64px;
font-weight:bold;
letter-spacing:4px;
color:#dcb44a;
text-shadow:
2px 2px 0 #000,
0 0 8px rgba(255,215,0,.2);
}

.header h2{
margin-top:10px;
font-size:21px;
letter-spacing:5px;
font-weight:400;
color:#f4f4f4;
text-transform:uppercase;
}

.divider{
height:2px;
background:#d4af37;
margin:20px 40px;
}

table{
width:100%;
border-collapse:collapse;
}

thead{
background:#10284b;
}

th{
padding:15px 10px;
font-size:14px;
letter-spacing:1px;
text-transform:uppercase;
color:#dcb44a;
border-bottom:2px solid #d4af37;
}

tbody tr:nth-child(even){
background:#0b1b33;
}

tbody tr:hover{
background:#13294a;
}

td{
padding:14px 10px;
font-size:15px;
border-bottom:1px solid rgba(255,255,255,.08);
}

.rank{
width:55px;
text-align:center;
font-size:20px;
font-weight:bold;
color:#dcb44a;
}

.gym{
font-weight:bold;
font-size:17px;
}

.manager{
display:block;
font-size:13px;
color:#bfc7d4;
font-weight:normal;
margin-top:2px;
}

.country{
text-align:center;
}

.titles{
color:#ffd34d;
font-weight:bold;
}

.plus{
color:#49df70;
font-weight:bold;
}

.win{
color:#66ef7c;
font-weight:bold;
}

.money{
white-space:nowrap;
}

.epf{
font-weight:bold;
}

@media(max-width:900px){

body{
padding:8px;
}

.board{
border-width:3px;
}

.header h1{
font-size:42px;
}

.header h2{
font-size:15px;
letter-spacing:2px;
}

table{
font-size:12px;
}

th,td{
padding:8px 5px;
}

.manager{
display:none;
}

}

</style>

</head>

<body>

<div class="board">

<div class="header">

<h1>WEBL BARE KNUCKLE</h1>

<h2>OFFICIAL ALL-TIME GYM RANKINGS</h2>

</div>

<div class="divider"></div>

<table>

<thead>

<tr>

<th>#</th>
<th>Gym / Manager</th>
<th>Country</th>
<th>Titles</th>
<th>Record (W-L-D)</th>
<th>+/-</th>
<th>Win %</th>
<th>Earnings</th>
<th>EPF</th>

</tr>

</thead>

<tbody>
